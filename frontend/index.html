<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>College Project</title>

  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="./src/css/output.css"> <!-- Linking toast.css -->
  <script src="./src/config.js"></script>
</head>

<body>
  <div class="container">
    <div class="tabs">
      <div class="tab active" onclick="switchForm('login')">Login</div>
      <div class="tab" onclick="switchForm('signup')">Sign Up</div>
    </div>

    <!-- Login Form -->
    <form id="loginForm" class="form active" onsubmit="login(event)">
      <div class="form-group">
        <label for="login-email">Email Address</label>
        <input type="email" id="login-email" name="email" required autocomplete="email" autofocus
          placeholder="Enter your email">
      </div>
      <div class="form-group">
        <label for="login-password">Password</label>
        <input type="password" id="login-password" name="password" required autocomplete="current-password"
          placeholder="Enter your password">
      </div>
      <button type="submit">Login</button>
    </form>

    <!-- Signup Form -->
    <form id="signupForm" class="form" onsubmit="signup(event)">
      <div class="form-group">
        <label for="fullname">Full Name</label>
        <input type="text" id="fullname" name="fullname" required autocomplete="name"
          placeholder="Enter your full name">
      </div>
      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" name="email" required autocomplete="email" placeholder="Enter your email">
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required autocomplete="new-password"
          placeholder="Create a password">
      </div>
      <button type="submit">Create Account</button>
      <div class="w-full mt-4">
        <p class="w-full text-sm text-center">Already have an account ? <a onclick="switchForm()"
            class="text-[#8400ff] cursor-pointer">Login</a></p>
      </div>
    </form>
  </div>
</body>
<script src="./src/toast.js"></script> <!-- Linking toast.js -->
<script src="./src/auth.js"></script>

</html>
