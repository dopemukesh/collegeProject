<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>College Project</title>
  <script src="auth.js"></script>
  <!-- <link rel="stylesheet" href="./HomeStyle/homeStyle.css"> -->
  <link rel="stylesheet" href="./css/output.css"> <!-- Linking toast.css -->
</head>

<body class="bg-gradient-to-b from-blue-200 via-10% to-white min-h-screen">
  <header class="p-4 flex flex-col gap-4">
    <div class="flex justify-between items-center">
      <div class="flex items-center gap-4">
        <div class="flex items-center justify-center w-10 h-10 overflow-hidden bg-white rounded-full shadow-md">
          <img src="./assets/image/profile3D-avatar.png" alt="Logo" class="w-10 h-10">
        </div>
        <div class="flex flex-col justify-center ">
          <p class="text-[10px] font-medium">Welcome Back</p>
          <p id="fullname" class="font-semibold">
            <!-- User's first name will be displayed here -->
          </p>
        </div>
      </div>
      <div class="cursor-pointer flex items-center justify-center w-10 h-10 overflow-hidden bg-white rounded-full shadow-md">
        🔔
      </div>
    </div>
    <div class="flex items-center justify-between gap-2">
      <div class="w-full">
        <input type="text" placeholder="Search developer or anything..." class="w-full h-10 px-4 rounded-full bg-white shadow-lg focus:outline-none">
      </div>
      <div class="cursor-pointer flex flex-1 items-center justify-center min-w-10 min-h-10 overflow-hidden bg-white rounded-full shadow-md">
        🔥
      </div>
    </div>
  </header>

  <main class="min-h-screen px-4 flex justify-center">
    <div class="w-full h-fit bg-gradient-to-l from-blue-500 via-10% to-blue-400 rounded-lg shadow-md p-6">
      <div class="flex flex-col mb-4">
        <h1 class="text-lg text-white font-bold">Welcome to the Home Page</h1>
        <p class="text-xs text-gray-200">This is dummy project</p>
      </div>
      <div class="w-full flex justify-end">
        <button onclick="logout()"
          class="cursor-pointer flex items-center bg-white text-sm font-medium px-6 py-2 rounded-full">Logout</button>
      </div>
    </div>
  </main>
</body>
<script src="toast.js"></script> <!-- Linking toast.js -->
<script>
  window.onload = function () {
    const user = JSON.parse(localStorage.getItem('currentUser'));
    if (!user) return window.location.href = 'index.html';
    document.getElementById('fullname').innerText = user.username.split(' ')[0] + '👋🏻';
  };
  function logout() {
    localStorage.removeItem('currentUser');
    window.location.href = '../index.html';
    showToast('Logout successful', 'success');
  }
</script>

</html>
